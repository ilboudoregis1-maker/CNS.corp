<h2>4. Photos, vidéos, vocaux et fichiers</h2>
<p>Ces contenus sont <b>chiffrés sur votre appareil avant l'envoi</b>. Ils sont ensuite transférés vers un bot Telegram utilisé comme espace de stockage technique. Ce bot ne reçoit que des données chiffrées : il ne voit ni image, ni son, ni vidéo, seulement une suite de caractères illisible. Seule l'application du destinataire peut les déchiffrer et les afficher. Le message associé (y compris la référence vers le média) est supprimé de nos serveurs après 15 jours ; un média non reçu dans ce délai n'est plus accessible depuis l'application.</p>
<p>Comme tout service tiers, Telegram applique ses propres conditions ; il traite uniquement des fichiers chiffrés pour le compte de TÕÕLé.</p>
<h2>5. Confidentialité et sécurité de votre compte</h2>

<li>Les connexions à nos serveurs sont sécurisées (HTTPS) et votre mot de passe est stocké sous forme protégée.</li>
<li>Nous ne pouvons pas, et ne vous demanderons jamais, votre mot de passe. Méfiez-vous de toute personne qui prétend le contraire.</li>

<p>Attention : un destinataire peut toujours copier, capturer ou transférer ce que vous lui envoyez. Envoyez uniquement à des personnes de confiance.</p>
<h2>6. Fonction d'appel : en cours de développement</h2>
<p>Les appels audio et vidéo ne sont pas encore disponibles. Cette fonction est en cours de développement ; elle pourra être ajoutée dans une version future, et cette politique sera alors mise à jour avant son activation.</p>

<p>Ils agissent comme sous-traitants et peuvent héberger des données hors de votre pays. Nous ne communiquons vos données à aucune autre personne, sauf obligation légale ou décision de justice.</p>
<h2>8. Autorisations de l'application</h2>
<ul><li><b>Microphone</b> : enregistrement des messages vocaux, seulement quand vous l'utilisez ;</li><li><b>Notifications</b> : vous alerter de nouveaux messages ;</li><li><b>Internet, vibreur</b> : fonctionnement normal.</li></ul>
<p>Vous pouvez retirer ces autorisations dans les réglages du téléphone ; certaines fonctions cesseront alors de marcher.</p>
<h2>9. Vos droits et la suppression de votre compte</h2>
<p>Vous pouvez demander l'accès, la correction ou la suppression de vos données, ou vous opposer à un traitement. Pour <b>supprimer votre compte</b> : Paramètres → Supprimer mon compte (action définitive). Vous pouvez aussi nous écrire ; nous répondons au plus tard sous 30 jours. Vous pouvez enfin saisir l'autorité de protection des données de votre pays (au Burkina Faso : la CIL).</p>
<h2>10. Mineurs</h2>
<p>L'application est réservée aux personnes de 13 ans et plus ; les mineurs l'utilisent avec l'accord d'un parent ou tuteur. Nous ne vérifions pas l'âge à l'inscription : en créant un compte, vous déclarez avoir au moins 13 ans. Si nous apprenons qu'un compte appartient à un enfant de moins de 13 ans (par exemple si un parent nous le signale), nous le supprimons. Parents : écrivez-nous pour demander la suppression du compte de votre enfant.</p>
<h2>11. Modifications</h2>
<p>Nous pouvons faire évoluer cette politique. Les changements importants seront signalés dans l'application. La date en haut indique la version en vigueur.</p>

privacy:`<h1>Privacy Policy</h1>
<p class="m">Version 2.0 – Last updated: October 30, 2026</p>
<p>At TÕÕLé, we want you to know exactly how the app works before you use it. This page is written to be read: please take a moment to go through it.</p>

<h2>1. Who are we?</h2>
<p>TÕÕLé is a messaging app published by <b>CNS.corp</b>. CNS.corp is responsible for the data processing described below.</p>
<h2>2. Data we process</h2>
<ul><li><b>Account</b>: country code, phone number, password (stored in protected form, never readable by us), and the name and profile photo you choose.</li>
<li><b>Messages in transit</b>: the encrypted content of your messages, for the time needed to deliver them (15 days maximum).</li>
<li><b>Technical operating information</b>: sender and recipient identifiers, date and time, size of items, presence status (online, “typing”), your device's notification token. This is necessary to deliver a message.</li></ul>
<p>We do <b>not</b> collect your location or read your phone contacts without your knowledge.</p>
<h2>3. Messages: automatic deletion after 15 days</h2>
<p>A sent message is kept on our servers only to be delivered. It is <b>automatically deleted no later than 15 days</b> after sending, whether received or not. In practice:</p>
<ul><li>if the recipient connects within 15 days, they receive the message, which then stays on their device;</li>
<li>after that, the message is erased from our servers and is <b>no longer recoverable</b> by anyone, including us;</li>
<li>we keep no backup copy of your conversations; history is kept on participants' devices. If you lose or reset your phone, it may be lost permanently.</li></ul>
<h2>4. Photos, videos, voice messages and files</h2>
<p>These are <b>encrypted on your device before sending</b>. They are then transferred to a Telegram bot used as technical storage. This bot only receives encrypted data: it sees no image, sound or video, just an unreadable string of characters. Only the recipient's app can decrypt and display them. The related message (including the media reference) is deleted from our servers after 15 days; media not received within that time is no longer accessible from the app.</p>
<p>Like any third-party service, Telegram applies its own terms; it only handles encrypted files on behalf of TÕÕLé.</p>
<h2>5. Privacy and account security</h2>
<ul><li>The content of your messages and media is encrypted; we do not view it and our team does not read your conversations.</li>
<li>Connections to our servers are secure (HTTPS) and your password is stored in protected form.</li>
<li>We cannot, and will never, ask for your password. Beware of anyone claiming otherwise.</li>
<li>No system is infallible. Protect your phone, choose a strong password and share it with no one. If in doubt about your account, contact us.</li></ul>
<p>Note: a recipient can always copy, screenshot or forward what you send. Only send to people you trust.</p>
<h2>6. Calling feature: under development</h2>
<p>Audio and video calls are not available yet. This feature is under development; it may be added in a future version, and this policy will be updated before it is activated.</p>
<h2>7. Technical providers</h2>
<ul><li><b>Supabase</b>: database, authentication and real-time messaging;</li><li><b>Telegram (bot)</b>: storage of encrypted files;</li><li><b>Google Firebase Cloud Messaging</b>: notification delivery.</li></ul>
<p>They act as processors and may host data outside your country. We share your data with no one else, except where required by law or court order.</p>
<h2>8. App permissions</h2>
<ul><li><b>Microphone</b>: recording voice messages, only when you use it;</li><li><b>Notifications</b>: alerting you to new messages;</li><li><b>Internet, vibration</b>: normal operation.</li></ul>
<p>You can withdraw these in your phone settings; some features will then stop working.</p>
<h2>9. Your rights and account deletion</h2>
<p>You may request access to, correction or deletion of your data, or object to processing. To <b>delete your account</b>: Settings → Delete my account (permanent). You can also write to us; we reply within 30 days at most. You may also contact your country's data protection authority (in Burkina Faso: the CIL).</p>
<h2>10. Minors</h2>
<p>The app is for people aged 13 and over; minors use it with a parent's or guardian's consent. We do not verify age at sign-up: by creating an account, you declare that you are at least 13. If we learn that an account belongs to a child under 13 (for example, if a parent reports it), we delete it. Parents: write to us to request deletion of your child's account.</p>

<p>We may update this policy. Important changes will be shown in the app. The date at the top shows the current version.</p>
